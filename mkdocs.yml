
site_name: Smart Industrial Monitoring Platform
site_description: Industrial product and developer documentation
site_author: Documentation Portfolio

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md

  - Industrial Documentation:
      - Overview: industrial/overview.md
      - Installation: industrial/installation.md
      - Configuration: industrial/configuration.md
      - Operation: industrial/operation.md
      - Troubleshooting: industrial/troubleshooting.md
      - Safety Messages: industrial/safety-messages.md

  - Developer Documentation:
      - Overview: developer/overview.md
      - Authentication: developer/authentication.md
      - Integration: developer/integration.md

  - API Reference:
      - API Overview: api/api-reference.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js